<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="sidebar.css">
</head>
<body>
<div class="app">
    <div class="header">
        <div class="title-row">
            <h1>ChatSeek</h1>
            <div class="header-actions">
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme mode">Auto</button>
                <span id="result-count" class="count-badge"></span>
            </div>
        </div>
        <input id="search" placeholder="Search conversation..." autocomplete="off" />
        <div class="controls-row">
            <select id="search-mode" aria-label="Search mode">
                <option value="currentChat">This chat</option>
                <option value="allChats">All chats</option>
            </select>
            <select id="scope-filter" aria-label="Search scope">
                <option value="recent">Recent</option>
                <option value="all">All indexed</option>
            </select>
            <select id="author-filter" aria-label="Author filter">
                <option value="all">All roles</option>
                <option value="user">User</option>
                <option value="assistant">Assistant</option>
            </select>
        </div>
    </div>
    <div id="results" aria-live="polite"></div>
</div>

<script src="search.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
